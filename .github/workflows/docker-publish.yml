name: Docker Build and Publish

on:
  push:
    branches: ["master", "new-dev"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=,enable=true
            type=raw,value=new,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Get version
        id: get_version
        run: echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Update version in app.php
        run: |
          VERSION=$(date '+%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php
          echo "Updated version to: $VERSION"

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDKIT_MULTI_PLATFORM=1
            CACHEBUST=${{ github.sha }}
            REPO_URL=https://github.com/${{ github.repository }}
            BRANCH_NAME=${{ github.ref_name }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host

      # ── GitOps write-back: update image digest in EmbyMirage/EmbyMirage ──
      - name: Get image digest
        id: digest
        run: |
          DIGEST="${{ steps.build-and-push.outputs.digest }}"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Built image digest: $DIGEST"

      - name: Write-back to GitOps repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ghcr.io/sdongmaker/xboard
          DIGEST: ${{ steps.digest.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REPO="https://x-access-token:${GITOPS_TOKEN}@github.com/EmbyMirage/EmbyMirage.git"
          CLONE_DIR="gitops"

          git clone --depth 1 --branch dev "$REPO" "$CLONE_DIR"
          cd "$CLONE_DIR"

          IMAGE_REF="${IMAGE}@${DIGEST}"
          FILE="K8S/manifests/apps/xboard/deployments.yaml"
          CRONFILE="K8S/manifests/apps/xboard/cronjobs.yaml"

          echo "Updating image references to: $IMAGE_REF"
          sed -i "s|ghcr.io/sdongmaker/xboard@sha256:[a-f0-9]*|${IMAGE_REF}|g" "$FILE" "$CRONFILE"

          # Verify replacement happened
          COUNT=$(grep -c "$IMAGE_REF" "$FILE" || true)
          echo "Replaced $COUNT image references in deployments.yaml"
          CRON_COUNT=$(grep -c "$IMAGE_REF" "$CRONFILE" || true)
          echo "Replaced $CRON_COUNT image references in cronjobs.yaml"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No image references replaced!"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE" "$CRONFILE"
          git commit -m "chore(xboard): auto-update image to ${TAG} (${DIGEST:0:19})

          Triggered by tag ${TAG} in Sdongmaker/Xboard CI.
          Built commit: ${{ github.sha }}"

          git push origin dev
          echo "GitOps write-back complete"
